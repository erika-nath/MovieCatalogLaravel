<div style="padding: 20px; font-family: Arial, sans-serif;">
  <h2>🎬 Mi Catálogo de Películas (Angular + Laravel)</h2>

  @if (movies.length === 0) {
    <p>Cargando películas o no hay registros en la base de datos...</p>
  }

  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px;">
    @for (movie of movies; track movie.id) {
      <div style="border: 1px solid #ccc; padding: 15px; border-radius: 8px; background-color: #f9f9f9;">
        <h3 style="margin-top: 0;">{{ movie.title }}</h3>
        <p><strong>Género:</strong> {{ movie.genre }}</p>
        <p><strong>Año:</strong> {{ movie.year }}</p>
      </div>
    }
  </div>
</div>
